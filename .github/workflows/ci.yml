name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv
      - run: uv pip install -r crw/requirements.txt
      - run: uv pip install ruff
      - run: uv run ruff check crw/

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv
      - run: uv pip install -r crw/requirements.txt
      - run: uv pip install pytest
      - run: uv run python -m pytest crw/tests/ -v
        env:
          CRW_API_KEY: ${{ secrets.CRW_API_KEY }}
