identity:
  name: crw
  author: us
  label:
    en_US: CRW
    zh_Hans: CRW
  description:
    en_US: >-
      fastCRW, the open-source web data API built for AI agents.
      Scrape, crawl, map, and search. Cloud or self-hosted.
    zh_Hans: >-
      fastCRW，为 AI Agent 打造的开源网页数据 API。
      抓取、爬取、映射与搜索。支持云端或自托管。
  icon: icon.svg
  tags:
    - search
    - utilities

credentials_for_provider:
  base_url:
    type: text-input
    required: false
    label:
      en_US: CRW Server Base URL
      zh_Hans: CRW 服务器 Base URL
    placeholder:
      en_US: https://fastcrw.com/api
    help:
      en_US: >-
        Leave empty. The plugin talks to the fastCRW cloud API by default,
        which is what an API key from fastcrw.com is for. Only set this if you
        run your own CRW server.
      zh_Hans: >-
        留空即可。插件默认使用 fastCRW 云端 API，这也是 fastcrw.com
        API 密钥的用途。仅在自建 CRW 服务器时才需要填写。
  api_key:
    type: secret-input
    required: true
    label:
      en_US: CRW API Key
      zh_Hans: CRW API 密钥
    placeholder:
      en_US: crw_live_...
    help:
      en_US: >-
        Get a free API key at fastcrw.com (500 credits, no card required).
        Paste it here and leave Base URL empty. Self-hosted servers running
        without auth accept any value.
      zh_Hans: >-
        在 fastcrw.com 免费获取 API 密钥（500 积分，无需信用卡）。
        粘贴到此处并将 Base URL 留空。未配置认证的自托管服务器可填写任意值。
    url: https://fastcrw.com

tools:
  - tools/scrape.yaml
  - tools/crawl.yaml
  - tools/crawl_status.yaml
  - tools/map.yaml
  - tools/search.yaml
  - tools/extract.yaml

extra:
  python:
    source: provider/crw.py
